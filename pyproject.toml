[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calibre-metadata-toolkit"
version = "1.4.0"
description = "AI-assisted metadata enrichment pipeline for Calibre libraries"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "anthropic>=0.25",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "textual>=0.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
calibre-toolkit = "calibre_toolkit.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["calibre_toolkit*"]
